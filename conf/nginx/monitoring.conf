server {
    listen 443 ssl;
    http2 on;
    server_name grafana.insrv5.local;

    ssl_certificate /etc/ssl/certs/insrv5.local.crt;
    ssl_certificate_key /etc/ssl/certs/insrv5.local.key;

    allow 192.168.5.0/24;
    allow 192.168.51.0/24;
    allow 10.8.0.0/24;
    deny all;

    set $req_role "IT";
    include /etc/nginx/conf.d/snippets/insrv5_auth.conf;

    location / {
        proxy_pass http://192.168.51.45:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name prometheus.insrv5.local;

    ssl_certificate /etc/ssl/certs/insrv5.local.crt;
    ssl_certificate_key /etc/ssl/certs/insrv5.local.key;

    allow 192.168.5.0/24;
    allow 192.168.51.0/24;
    allow 10.8.0.0/24;
    deny all;

    set $req_role "IT";
    include /etc/nginx/conf.d/snippets/insrv5_auth.conf;

    location / {
        proxy_pass http://192.168.51.40:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 8080;
    server_name nginx-metrics;

    location = /stub_status {
        stub_status;
        allow 192.168.5.0/24;
        allow 192.168.51.0/24;
        deny all;
        access_log off;
    }

    location / {
        return 404;
    }
}
