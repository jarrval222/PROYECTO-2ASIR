name: Docker-Enterprise-Stack

services:
  dns:
    image: ubuntu/bind9:latest
    container_name: dns
    environment:
      - TZ=Europe/Madrid
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./conf/bind9/named.conf.options:/etc/bind/named.conf.options
      - ./conf/bind9/named.conf.local:/etc/bind/named.conf.local
      - ./conf/bind9/db.insrv5.net:/etc/bind/db.insrv5.net
      - ./conf/bind9/db.insrv5.local:/etc/bind/db.insrv5.local
    networks:
      insrv_net:
        ipv4_address: 192.168.5.253
      insrv_local:
        ipv4_address: 192.168.51.253

  openldap:
    image: osixia/openldap:latest
    container_name: ldap-server
    command: --copy-service
    environment:
      - LDAP_ORGANISATION=Internal SL
      - LDAP_DOMAIN=insrv5.local
      - LDAP_ADMIN_PASSWORD=admnpasswd
      # --- LDAP Secure (SSL/TLS)---
      - LDAP_TLS=true
      - LDAP_TLS_VERIFY_CLIENT=try
      - LDAP_TLS_CRT_FILENAME=insrv5.local.crt
      - LDAP_TLS_KEY_FILENAME=insrv5.local.key
      - LDAP_TLS_CA_CRT_FILENAME=insrv5.local.crt
      # --- Cuenta de servicio ---
      - LDAP_READONLY_USER=true
      - LDAP_READONLY_USER_USERNAME=visor-usuarios
      - LDAP_READONLY_USER_PASSWORD=visorpwd
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./conf/ssl/certs:/container/service/slapd/assets/certs/
      - ./conf/ldap/01-init.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/01-init.ldif
    depends_on:
      - dns
    dns:
      - 192.168.51.253
    networks:
      insrv_local:
        ipv4_address: 192.168.51.252

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: ldap-admin
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
      - PHPLDAPADMIN_HTTPS=false
      - PHPLDAPADMIN_SERVER_NAME=Internal5 LDAP
    depends_on:
      - openldap
    networks:
      insrv_local:
        ipv4_address: 192.168.51.4

  db:
    image: mysql
    container_name: db
    environment:
      - MYSQL_ROOT_PASSWORD=root # Esto en prod. debería ir en un .env
      - MYSQL_DATABASE=insrv5_db # Esto en prod. debería ir en un .env
      - MYSQL_USER=user # Esto en prod. debería ir en un .env
      - MYSQL_PASSWORD=1234 # Esto en prod. debería ir en un .env
      - TZ=Europe/Madrid
    volumes:
      - db_data:/var/lib/mysql
      - ./conf/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      insrv_local:
        ipv4_address: 192.168.51.250

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    environment:
      - PMA_HOST=db
      - PMA_USER=user # Esto en prod. debería ir en un .env
      - PMA_PASSWORD=1234 # Esto en prod. debería ir en un .env
    depends_on:
      - db
    networks:
      insrv_local:
        ipv4_address: 192.168.51.3

  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./conf/nginx:/etc/nginx/conf.d:ro
      - ./conf/ssl/certs:/etc/ssl/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      insrv_net:
        ipv4_address: 192.168.5.10
      insrv_local:
        ipv4_address: 192.168.51.100

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./conf/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      insrv_local:
        ipv4_address: 192.168.51.40

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./conf/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    dns:
      - 192.168.51.253
    depends_on:
      - dns
    networks:
      insrv_local:
        ipv4_address: 192.168.51.41

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      insrv_local:
        ipv4_address: 192.168.51.42

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    restart: unless-stopped
    environment:
      - MYSQLD_EXPORTER_PASSWORD=1234
    command:
      - "--mysqld.username=user"
      - "--mysqld.address=db:3306"
    depends_on:
      - db
    networks:
      insrv_local:
        ipv4_address: 192.168.51.43

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    depends_on:
      - nginx
    networks:
      insrv_local:
        ipv4_address: 192.168.51.44

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=grafana.insrv5.local
      - GF_SERVER_ROOT_URL=https://grafana.insrv5.local/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./conf/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      insrv_local:
        ipv4_address: 192.168.51.45
  
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      insrv_local:
        ipv4_address: 192.168.51.50

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./conf/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    user: root
    depends_on:
      - loki
    networks:
      insrv_local:
        ipv4_address: 192.168.51.51
  
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./conf/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      insrv_local:
        ipv4_address: 192.168.51.52

  apache:
    build:
      context: ./Docker/apache
    container_name: apache
    environment:
      - TZ=Europe/Madrid
    volumes:
      - ./conf/www:/var/www/html/
      - ./backups:/backups
    dns:
      - 192.168.51.253
    networks:
      insrv_local:
        ipv4_address: 192.168.51.2
      insrv_net:
        ipv4_address: 192.168.5.2
    depends_on:
      - dns
      - db
      - openldap

  # INTEGRACIÓN MailServer (docker-mailserver)

  mailserver:
    image: mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.insrv5.local
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - ./mail/mail-data:/var/mail
      - ./mail/mail-state:/var/mail-state
      - ./mail/mail-logs:/var/log/mail
      - ./mail/config:/tmp/docker-mailserver
      - /etc/localtime:/etc/localtime:ro
      - ./conf/ssl/certs:/etc/ssl/custom:ro
    environment:
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ONE_DIR=1
      - DOMAINNAME=insrv5.local
      # --- INTEGRACIÓN CON LDAP ---
      - ACCOUNT_PROVISIONER=LDAP
      - LDAP_SERVER_HOST=192.168.51.252
      - LDAP_SEARCH_BASE=ou=usuarios,dc=insrv5,dc=local
      - LDAP_BIND_DN=cn=admin,dc=insrv5,dc=local
      - LDAP_BIND_PW=admnpasswd
      - LDAP_QUERY_FILTER_USER=(&(objectClass=inetOrgPerson)(mail=%s))
      # --- Configuración SSL/TLS ---
      - SSL_TYPE=manual
      - SSL_CERT_PATH=/etc/ssl/custom/insrv5.local.crt
      - SSL_KEY_PATH=/etc/ssl/custom/insrv5.local.key
    networks:
      insrv_local:
        ipv4_address: 192.168.51.25
    dns:
      - 192.168.51.253
    depends_on:
      - dns
      - openldap

  # Redmine
  # INTEGRACIÓN REDMINE (Gestor de Tareas y Control de Horas)
  redmine:
    image: redmine:trixie
    container_name: redmine
    hostname: tareas.insrv5.local
    restart: unless-stopped
    environment:
      - REDMINE_DB_MYSQL=db
      - REDMINE_DB_DATABASE=redmine_db
      - REDMINE_DB_USERNAME=user
      - REDMINE_DB_PASSWORD=1234
    volumes:
      - ./redmine/files:/usr/src/redmine/files
    networks:
      insrv_local:
        ipv4_address: 192.168.51.10
    dns:
      - 192.168.51.253
    depends_on:
      - db
      - openldap

  vpn:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: vpn
    environment:
      - WG_HOST=127.0.0.1
      - WG_DEFAULT_DNS=192.168.51.253, 1.1.1.1
      - WG_ALLOWED_IPS=192.168.5.0/24,192.168.51.0/24
      - WG_POST_UP=iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -j MASQUERADE; iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -j ACCEPT
      - WG_POST_DOWN=iptables -t nat -D POSTROUTING -s 10.8.0.0/24 -j MASQUERADE; iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -j ACCEPT
    volumes:
      - /lib/modules:/lib/modules:ro
      - vpn_data:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      insrv_net:
        ipv4_address: 192.168.5.20
      insrv_local:
        ipv4_address: 192.168.51.20

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped
    networks:
      insrv_local:
        ipv4_address: 192.168.51.5

  backup-manager:
    image: docker:cli
    container_name: backup-manager
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backups:/backups
      - ./conf/backup/backup.sh:/backup.sh:ro
      - grafana_data:/backup_src/grafana
      - vpn_data:/backup_src/vpn
      - ./redmine/files:/backup_src/redmine_files
      - ./mail/mail-data:/backup_src/mail
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - |
        chmod +x /backup.sh
        echo "0 3 * * * /backup.sh all >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        crond -b -l 8
        
        echo "Iniciando vigía de backups manuales..."
        while true; do
          if [ -f /backups/.lanzar_copia ]; then
            TARGETS=$$(cat /backups/.lanzar_copia)
            echo "[INFO] Lanzando copia manual: $$TARGETS"
            /backup.sh "$$TARGETS" >> /proc/1/fd/1 2>&1
            rm -f /backups/.lanzar_copia
            echo "[INFO] Copia completada: $$TARGETS"
            echo "Copia de seguridad completada: $$TARGETS." > /backups/.resultado
          fi
          
          if [ -f /backups/.restaurar_db ]; then
            ARCHIVO=$$(cat /backups/.restaurar_db)
            echo "[INFO] Restaurando DB: $$ARCHIVO"
            docker exec -i db mysql -u root -proot < "/backups/$$ARCHIVO" >> /proc/1/fd/1 2>&1
            rm -f /backups/.restaurar_db
            echo "[INFO] Restauración DB completada: $$ARCHIVO"
            echo "Base de datos restaurada desde '$$ARCHIVO'." > /backups/.resultado
          fi

          if [ -f /backups/.restaurar_ldap ]; then
            ARCHIVO=$$(cat /backups/.restaurar_ldap)
            echo "[INFO] Restaurando LDAP: $$ARCHIVO"
            docker exec -i ldap-server ldapadd -x -D "cn=admin,dc=insrv5,dc=local" -w admnpasswd -f "/backups/$$ARCHIVO" >> /proc/1/fd/1 2>&1
            rm -f /backups/.restaurar_ldap
            echo "[INFO] Restauración LDAP completada: $$ARCHIVO"
            echo "Directorio LDAP restaurado desde '$$ARCHIVO'." > /backups/.resultado
          fi
          
          if [ -f /backups/.restaurar_tar ]; then
            ARCHIVO=$$(cat /backups/.restaurar_tar)
            echo "[INFO] Restaurando TAR: $$ARCHIVO"
            case "$$ARCHIVO" in
              grafana_*) docker stop grafana >> /proc/1/fd/1 2>&1; tar -xzf "/backups/$$ARCHIVO" -C /backup_src/grafana >> /proc/1/fd/1 2>&1; docker start grafana >> /proc/1/fd/1 2>&1 ;;
              vpn_*) docker stop vpn >> /proc/1/fd/1 2>&1; tar -xzf "/backups/$$ARCHIVO" -C /backup_src/vpn >> /proc/1/fd/1 2>&1; docker start vpn >> /proc/1/fd/1 2>&1 ;;
              redmine_*) docker stop redmine >> /proc/1/fd/1 2>&1; tar -xzf "/backups/$$ARCHIVO" -C /backup_src/redmine_files >> /proc/1/fd/1 2>&1; docker start redmine >> /proc/1/fd/1 2>&1 ;;
              mail_*) docker stop mailserver >> /proc/1/fd/1 2>&1; tar -xzf "/backups/$$ARCHIVO" -C /backup_src/mail >> /proc/1/fd/1 2>&1; docker start mailserver >> /proc/1/fd/1 2>&1 ;;
            esac
            rm -f /backups/.restaurar_tar
            echo "[INFO] Restauración TAR completada: $$ARCHIVO"
            echo "Restauración completada desde '$$ARCHIVO'." > /backups/.resultado
          fi

          if [ -f /backups/.eliminar_archivo ]; then
            ARCHIVO=$$(basename "$$(cat /backups/.eliminar_archivo)")
            echo "[INFO] Eliminando archivo: $$ARCHIVO"
            rm -f "/backups/$$ARCHIVO"
            rm -f /backups/.eliminar_archivo
            echo "[INFO] Archivo eliminado: $$ARCHIVO"
            echo "Archivo '$$ARCHIVO' eliminado correctamente." > /backups/.resultado
          fi

          sleep 2
        done
    networks:
      insrv_local:
        ipv4_address: 192.168.51.60

volumes:
  db_data:
  ldap_data:
  ldap_config:
  vpn_data:
  prometheus_data:
  grafana_data:
  portainer_data:

networks:
  insrv_net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1500"
    ipam:
      config:
        - subnet: 192.168.5.0/24
          gateway: 192.168.5.1
  insrv_local:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1500"
    ipam:
      config:
        - subnet: 192.168.51.0/24
          gateway: 192.168.51.1